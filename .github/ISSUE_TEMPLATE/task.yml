name: Engineering Task
description: A roadmap-derived unit of work (E#-T##)
title: "[E?-T??] "
labels: ["type:task"]
body:
  - type: input
    id: taskid
    attributes: { label: Task ID, placeholder: "E2-T02" }
    validations: { required: true }
  - type: textarea
    id: purpose
    attributes: { label: Purpose }
    validations: { required: true }
  - type: textarea
    id: contracts
    attributes: { label: Contracts touched (messages/events/ports/storage) }
  - type: textarea
    id: acceptance
    attributes: { label: Completion criteria (from roadmap/EES) }
    validations: { required: true }
  - type: dropdown
    id: effort
    attributes: { label: Effort (S<=1d, M=2-3d, L=4-6d, XL=7-10d), options: [S, M, L, XL] }

name: 'PR Gate (Constitution §11: main is always releasable)'
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm lint:format
      - name: ESLint (incl. ledge custom rules)
        run: pnpm lint
      - name: Dependency law (Blueprint §4)
        run: pnpm check:deps
      - name: Calm-copy lint (Principle 22)
        run: pnpm check:copy
      - name: Error map complete (EES §3.2, E1-T08)
        run: pnpm check:errors
      - name: Dependency policy D-01 (<=5 runtime deps, quarantine)
        run: pnpm check:dep-policy
      - name: ADR-041 isolation + R7/R18 confidence gates (E8-T02)
        run: pnpm check:isolation
      - name: Typecheck
        run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unit (T-02 floors)
        run: pnpm test:unit
      - name: Property (T-03; 1000 seeds PR lane)
        run: pnpm test:property
        env: { FC_NUM_RUNS: 1000 }
      - name: Contract (ADR-032; identical suite per adapter)
        run: pnpm test:contract
      - name: Security (EES §8; boundary validator fuzz)
        run: pnpm test:security
        env: { FC_NUM_RUNS: 1000 }
  build-and-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (MV3)
        run: pnpm build
      - name: Bundle budgets (EES §7.3)
        run: pnpm check:bundle
      - name: 'Egress guard (A-10: network allowlist = empty set)'
        run: pnpm check:egress
      - name: Manifest integrity (ADR-022 signed baseline)
        run: pnpm check:manifest
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (prod zero-tolerance)
        run: pnpm audit --prod --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
